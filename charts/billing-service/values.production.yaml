
replicaCount: 3

image:
  repository: 123456789012.dkr.ecr.eu-central-1.amazonaws.com/cell-01/billing-service
  digest: ""
  requireDigest: true
  pullPolicy: IfNotPresent

serviceAccount:
  create: true
  roleArn: arn:aws:iam::123456789012:role/cell-01-billing-service
  automountServiceAccountToken: false

env:
  nodeEnv: production
  pgSslMode: verify-full
  devExposeTokens: "false"
  logLevel: info
  dbUser: billing_app
  dbIamAuth: "true"
  dbCaCertPath: /etc/ssl/certs/rds-global-bundle.pem

secrets:
  existingSecret: billing-service-secrets
  keys:
    AUTH_JWT_SECRET: jwt-secret
    STRIPE_SECRET_KEY: stripe-key

externalSecrets:
  enabled: true
  secretStoreRef:
    name: billing-service-secretstore
    kind: SecretStore
  refreshInterval: 1h
  remoteSecretName: /acme/cell-01/billing-service/app

resources:
  requests:
    cpu: 250m
    memory: 256Mi
  limits:
    cpu: "1"
    memory: 1Gi

networkPolicy:
  enabled: true
  allowedNamespace: api-gateway
  allowedPodLabels:
    app.kubernetes.io/name: api-gateway
  dnsNamespace: kube-system
  databasePort: 5432
  extraEgressCidrs:
    - 10.100.0.0/16

podDisruptionBudget:
  enabled: true
  minAvailable: 2

topologySpreadEnabled: true

ingress:
  enabled: false
  className: alb
  hostname: cell-01.platform.example.com
  annotations:
    alb.ingress.kubernetes.io/scheme: internal
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/ssl-policy: ELBSecurityPolicy-TLS13-1-2-2021-06
  tls:
    enabled: true
    secretName: billing-service-tls
