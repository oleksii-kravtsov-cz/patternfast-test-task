{{- if .Values.externalSecrets.enabled }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "billing-service.fullname" . }}
  labels:
    {{- include "billing-service.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.externalSecrets.secretStoreRef.name }}
    kind: {{ .Values.externalSecrets.secretStoreRef.kind }}
  target:
    name: {{ .Values.secrets.existingSecret }}
    creationPolicy: Owner
  data:
    {{- if not .Values.secrets.keys }}
    {{- fail "secrets.keys is empty, the Secret would have no keys" }}
    {{- end }}
    {{- range $envName, $secretKey := .Values.secrets.keys }}
    - secretKey: {{ $secretKey }}
      remoteRef:
        key: {{ $.Values.externalSecrets.remoteSecretName }}
        property: {{ $secretKey }}
    {{- end }}
{{- end }}
